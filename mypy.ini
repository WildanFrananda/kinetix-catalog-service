[mypy]
python_version = 3.14
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
ignore_missing_imports = False

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

[mypy-core.infrastructure.grpc.generated.*]
ignore_errors = True

[mypy-pricing.*]
ignore_missing_imports = True

[mypy-fulfillment.*]
ignore_missing_imports = True

[mypy-common.*]
ignore_missing_imports = True

[mypy-fleet.*]
ignore_missing_imports = True

# identity.v1 comes from the same generated contracts package as the four above. It ships no py.typed, so
# mypy reports it as "installed, but missing library stubs" — the one import it could not resolve on CI's
# first run.
[mypy-identity.*]
ignore_missing_imports = True

[mypy-returns.*]
ignore_missing_imports = True

# catalog.v1 is this service's own contract, served rather than consumed. It comes from the same
# generated package as the others above and ships no py.typed either.
#
# The consequence is the one worth writing down: mypy cannot see these message types, so a field
# renamed in the contract will not fail this check. core/tests/unit/test_contract_fields.py
# asserts the descriptors instead, and that test is the only thing standing between a contract
# change and a silent break.
[mypy-catalog.*]
ignore_missing_imports = True
