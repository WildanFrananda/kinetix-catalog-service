version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kinetix_catalog_db
    restart: always
    environment:
      POSTGRES_DB: kinetix_catalog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kinetix_catalog_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: kinetix_catalog_web
    restart: always
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=true
      - POSTGRES_DB=kinetix_catalog_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OMS_GRPC_HOST=host.docker.internal:50051
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
