# Secrets are read from the environment with the ${VAR:?message} form, which makes
# `docker compose` refuse to render at all when a value is missing rather than starting
# on a committed default (S1 / P0-SEC-02). Datastore ports are deliberately NOT published
# to the host: reach them from inside the compose network, or with `docker compose exec`.
services:
  db:
    image: postgres:16-alpine
    container_name: kinetix_catalog_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: kinetix_catalog_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - OMS_GRPC_HOST=host.docker.internal:50051
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
