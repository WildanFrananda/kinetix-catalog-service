# Secrets are read from the environment with the ${VAR:?message} form, which makes
# `docker compose` refuse to render at all when a value is missing rather than starting
# on a committed default (S1 / P0-SEC-02). Datastore ports are deliberately NOT published
# to the host: reach them from inside the compose network, or with `docker compose exec`.
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kinetix_catalog_db
    restart: always
    environment:
      POSTGRES_DB: kinetix_catalog_dev
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d kinetix_catalog_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: kinetix_catalog_web
    restart: always
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=kinetix_catalog_dev
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME is required}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OMS_GRPC_HOST=host.docker.internal:50051
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
